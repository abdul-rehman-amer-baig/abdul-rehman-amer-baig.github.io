<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Design | Abdul Rehman Amer Baig</title>
  
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  
  <style>
    body {
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      max-width: 760px;
    }

    .project-card {
      border: 1px solid #222;
      border-radius: 12px;
      background-color: #111;
      transition: transform 0.15s ease, border-color 0.15s ease;
      margin-bottom: 1rem;
    }

    .project-card:hover {
      transform: translateY(-2px);
      border-color: #2f6fed;
    }

    .project-link {
      text-decoration: none;
      color: inherit;
    }

    footer {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="container py-5">
    <header class="mb-5">
      <h1 class="name mb-1">System Design Projects</h1>
      <p class="subtitle mb-0">
        Explore my architecture and scalability solutions
      </p>
    </header>

    <!-- Project 1 -->
    <section>
      <a href="https://github.com/yourname/system-design-url-shortener" target="_blank" class="project-link">
        <div class="project-card p-4">
          <h2 class="h5 mb-1">URL Shortener</h2>
          <p class="subtitle mb-0">
            Scalable URL shortening service with analytics and high availability
          </p>
        </div>
      </a>
    </section>

    <!-- Project 2 -->
    <section>
      <a href="https://github.com/yourname/system-design-rate-limiter" target="_blank" class="project-link">
        <div class="project-card p-4">
          <h2 class="h5 mb-1">Rate Limiter</h2>
          <p class="subtitle mb-0">
            Token bucket and sliding window implementations for API throttling
          </p>
        </div>
      </a>
    </section>

    <footer class="mt-5">
      <p class="mb-0">© 2026 Abdul Rehman Amer Baig</p>
    </footer>
  </main>
</body>
</html>
