<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abdul Rehman Amer Baig</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      max-width: 760px;
    }

    .name {
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #9aa0a6;
    }

    .resume-card {
      border: 1px solid #222;
      border-radius: 12px;
      background-color: #111;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .resume-card:hover {
      transform: translateY(-2px);
      border-color: #2f6fed;
    }

    .resume-link {
      text-decoration: none;
      color: inherit;
    }

    footer {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="container py-5">
    <header class="mb-5">
      <h1 class="name mb-1">Abdul Rehman Amer Baig</h1>
      <p class="subtitle mb-0">
        Software Engineer • Backend & System Design
      </p>
    </header>

    <section>
      <a href="/resume.pdf" target="_blank" class="resume-link">
        <div class="resume-card p-4">
          <h2 class="h5 mb-1">Resume</h2>
          <p class="subtitle mb-0">
            View my experience, projects, and technical background (PDF)
          </p>
        </div>
      </a>
    </section>

    <footer class="mt-5">
      <p class="mb-0">© 2026 Abdul Rehman Amer Baig</p>
    </footer>
  </main>
</body>
</html>
