<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>Abdul Rehman Amer Baig</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  
  <!-- Google Fonts - Poppins (Highly Rated) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #fafafa;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --accent: #fde68a;
      --accent-hover: #fcd34d;
      --border: #e5e5e5;
      --border-hover: #d4d4d4;
      --gradient-start: #fef9e6;
      --gradient-end: #fef3c7;
      --highlight: #fef9e6;
      --highlight-hover: #fef3c7;
      --highlight-border: #fde68a;
    }

    [data-theme="dark"] {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #151515;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-tertiary: #666666;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --border: #1f1f1f;
      --border-hover: #2a2a2a;
      --highlight: #2a1a3d;
      --highlight-hover: #3d2a5f;
    }

    body {
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      line-height: 1.75;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s ease, color 0.3s ease;
    }


    main {
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 800px;
      padding: 0 1.5rem;
    }

    header {
      animation: fadeInUp 0.8s ease-out;
    }

    .name {
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      line-height: 1.15;
      text-align: left;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.125rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.6;
      text-align: left;
    }

    .resume-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-card);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    [data-theme="dark"] .resume-card {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .resume-card-accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, rgba(253, 230, 138, 0.4) 0%, rgba(252, 211, 77, 0.4) 100%);
      border-radius: 0 0 0 100%;
      opacity: 0.6;
      transition: all 0.4s ease;
    }

    [data-theme="dark"] .resume-card-accent {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(168, 85, 247, 0.25) 100%);
    }

    .resume-card:hover {
      transform: translateY(-4px);
      border-color: var(--border);
      box-shadow: 0 8px 24px rgba(253, 230, 138, 0.4);
    }

    [data-theme="dark"] .resume-card:hover {
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
    }

    .resume-card:hover .resume-card-accent {
      width: 150px;
      height: 150px;
      opacity: 0.8;
    }

    .resume-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 1.5rem 1rem;
      position: relative;
      z-index: 1;
    }

    .resume-icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fef9e6 0%, #fef3c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(253, 230, 138, 0.35);
    }

    [data-theme="dark"] .resume-icon-wrapper {
      background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .resume-card:hover .resume-icon-wrapper {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 6px 16px rgba(253, 230, 138, 0.4);
    }

    [data-theme="dark"] .resume-card:hover .resume-icon-wrapper {
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }

    .resume-icon {
      width: 28px;
      height: 28px;
      color: #92400e;
      stroke-width: 2.5;
    }

    [data-theme="dark"] .resume-icon {
      color: #ffffff;
    }

    .resume-badge {
      background: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 8px;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #92400e;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .resume-card:hover .resume-badge {
      background: #fcd34d;
      border-color: rgba(251, 191, 36, 0.5);
      color: #78350f;
    }

    [data-theme="dark"] .resume-badge {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    [data-theme="dark"] .resume-card:hover .resume-badge {
      background: rgba(139, 92, 246, 0.3);
      border-color: rgba(139, 92, 246, 0.5);
      color: #ddd6fe;
    }

    .resume-card-body {
      padding: 0 1.5rem 1.5rem;
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .resume-title {
      font-weight: 700;
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .resume-description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .resume-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: auto;
    }

    .resume-action {
      font-weight: 600;
      font-size: 0.9375rem;
      color: #d97706;
      transition: all 0.3s ease;
    }

    .resume-card:hover .resume-action {
      color: #f59e0b;
    }

    [data-theme="dark"] .resume-action {
      color: #a78bfa;
    }

    [data-theme="dark"] .resume-card:hover .resume-action {
      color: #c4b5fd;
    }

    .resume-arrow {
      color: #d97706;
      transition: all 0.3s ease;
    }

    .resume-card:hover .resume-arrow {
      transform: translateX(4px);
      color: #f59e0b;
    }

    [data-theme="dark"] .resume-arrow {
      color: #a78bfa;
    }

    [data-theme="dark"] .resume-card:hover .resume-arrow {
      color: #c4b5fd;
    }

    .resume-link {
      text-decoration: none;
      color: inherit;
      display: block;
      -webkit-tap-highlight-color: rgba(254, 249, 230, 0.3);
      min-height: 44px; /* Minimum touch target size */
    }

    .resume-link:focus {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 16px;
    }

    footer {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      animation: fadeIn 1s ease-out 0.5s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    section {
      animation: fadeInUp 0.8s ease-out;
      animation-fill-mode: both;
    }

    section:nth-child(2) {
      animation-delay: 0.1s;
    }

    section:nth-child(3) {
      animation-delay: 0.2s;
    }

    /* Responsive design */
    @media (max-width: 992px) {
      .container {
        max-width: 100%;
      }
    }

    @media (max-width: 768px) {
      .name {
        font-size: 2.25rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .container {
        padding: 0 1.25rem;
      }

      header {
        margin-bottom: 2.5rem;
        padding-top: 1.5rem;
      }

      .resume-card {
        min-height: 180px;
        border-radius: 16px;
      }

      .resume-card-header {
        padding: 1.25rem 1.25rem 0.875rem;
      }

      .resume-icon-wrapper {
        width: 48px;
        height: 48px;
      }

      .resume-icon {
        width: 24px;
        height: 24px;
      }

      .resume-card-body {
        padding: 0 1.25rem 1.25rem;
      }

      .resume-title {
        font-size: 1.5rem;
      }

      .resume-description {
        font-size: 0.9375rem;
      }

      footer {
        margin-top: 3rem;
        padding-top: 1.5rem;
        font-size: 0.8125rem;
      }

      section {
        margin-bottom: 1rem !important;
      }
    }

    @media (max-width: 576px) {
      .name {
        font-size: 1.875rem;
        line-height: 1.3;
        margin-bottom: 0.75rem;
      }

      .subtitle {
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      .container {
        padding: 0 1rem;
      }

      header {
        margin-bottom: 2rem;
        padding-top: 1rem;
      }

      .resume-card {
        min-height: 160px;
        border-radius: 16px;
      }

      .resume-card-header {
        padding: 1rem 1rem 0.75rem;
      }

      .resume-icon-wrapper {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      .resume-icon {
        width: 22px;
        height: 22px;
      }

      .resume-badge {
        padding: 0.25rem 0.625rem;
        font-size: 0.6875rem;
      }

      .resume-card-body {
        padding: 0 1rem 1rem;
      }

      .resume-title {
        font-size: 1.25rem;
      }

      .resume-description {
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }

      .resume-action {
        font-size: 0.875rem;
      }

      .resume-arrow {
        width: 18px;
        height: 18px;
      }

      footer {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        font-size: 0.75rem;
      }

      main {
        padding-top: 1rem !important;
        padding-bottom: 2rem !important;
      }
    }

    @media (max-width: 400px) {
      .name {
        font-size: 1.625rem;
      }

      .subtitle {
        font-size: 0.875rem;
      }

      .resume-card h2 {
        font-size: 1rem;
      }

      .resume-card .subtitle {
        font-size: 0.8125rem;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) and (pointer: coarse) {
      .resume-card:hover {
        transform: none;
      }

      .resume-card:active {
        transform: scale(0.98);
        border-color: var(--accent);
      }

      .resume-link:active .resume-card {
        transform: scale(0.98);
      }
    }

    /* Landscape mobile optimization */
    @media (max-width: 768px) and (orientation: landscape) {
      header {
        margin-bottom: 1.5rem;
        padding-top: 1rem;
      }

      .name {
        font-size: 2rem;
      }
    }

    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Prevent text overflow on mobile */
    body {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    h1, h2, h3, p {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Selection color */
    ::selection {
      background: #fde68a;
      color: #1a1a1a;
    }

    ::-moz-selection {
      background: #fde68a;
      color: #1a1a1a;
    }

    [data-theme="dark"] ::selection {
      background: #8b5cf6;
      color: #ffffff;
    }

    [data-theme="dark"] ::-moz-selection {
      background: #8b5cf6;
      color: #ffffff;
    }

    /* Bottom Navbar - Floating with rounded corners */
    .bottom-navbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #fef9e6;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1);
      font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .bottom-navbar {
      background: #e9d5ff;
      border-color: rgba(139, 92, 246, 0.2);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2), 0 2px 8px rgba(139, 92, 246, 0.15);
    }

    .bottom-navbar-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }

    .bottom-navbar a {
      color: #2c2c2c;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      position: relative;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] .bottom-navbar a {
      color: #581c87;
    }

    .bottom-navbar a:hover {
      background: rgba(0, 0, 0, 0.05);
      color: #000;
    }

    [data-theme="dark"] .bottom-navbar a:hover {
      background: rgba(139, 92, 246, 0.2);
      color: #4c1d95;
    }

    .bottom-navbar a.active {
      color: #000;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] .bottom-navbar a.active {
      color: #4c1d95;
      background: rgba(139, 92, 246, 0.25);
    }

    .bottom-navbar a.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #2c2c2c;
      border-radius: 2px;
    }


    @media (max-width: 768px) {
      .bottom-navbar {
        bottom: 1rem;
        padding: 0.625rem 1.25rem;
        border-radius: 40px;
      }

      .bottom-navbar-content {
        gap: 1.5rem;
      }

      .bottom-navbar a {
        font-size: 0.875rem;
        padding: 0.4rem 0.75rem;
      }

      body {
        padding-bottom: 70px !important;
      }
    }

    @media (max-width: 576px) {
      .bottom-navbar {
        bottom: 0.75rem;
        padding: 0.5rem 1rem;
        border-radius: 35px;
      }

      .bottom-navbar-content {
        gap: 1rem;
      }

      .bottom-navbar a {
        font-size: 0.8125rem;
        padding: 0.35rem 0.6rem;
      }

      body {
        padding-bottom: 65px !important;
      }
    }
  </style>
</head>

  <script>
    // Projects Data with Categories
    const projects = [
      {
        title: "URL Shortener",

        category: "system-design",
        githubUrl: "https://github.com/yourname/system-design-url-shortener"

    // Categories configuration

    // Shuffle array function
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // Current active category
    let activeCategory = 'system-design';

    // Render projects
    function renderProjects(filteredProjects) {
      const projectsList = document.getElementById('projectsListDropdown');
      const noResults = document.getElementById('noResultsDropdown');
      
      if (filteredProjects.length === 0) {
        projectsList.innerHTML = '';
        noResults.classList.add('show');
        return;
      }

      noResults.classList.remove('show');
      
      projectsList.innerHTML = filteredProjects.map((project) => `
        <a href="${project.githubUrl}" target="_blank" class="project-item-dropdown" rel="noopener noreferrer">
          <div class="project-item-content">
            <div class="project-item-header">
              <h4>${project.title}</h4>
              <span class="project-badge">System Design</span>
            </div>
            <p>${project.description}</p>
          </div>
        </a>
      `).join('');
    }

    // Filter projects by category and search
    function filterProjects(searchTerm, category = 'system-design') {
      let filtered = projects.filter(project => project.category === category);
      
      // Filter by search term
      if (searchTerm) {
        const term = searchTerm.toLowerCase().trim();
        filtered = filtered.filter(project => 
          project.title.toLowerCase().includes(term) ||
          project.description.toLowerCase().includes(term)
        );
      }
      
      return filtered;
    }

    // Update projects based on current filters
    function updateProjects() {
      const searchInput = document.getElementById('searchInputDropdown');
      const searchTerm = searchInput ? searchInput.value : '';
      const filtered = filterProjects(searchTerm, activeCategory);
      renderProjects(filtered);
    }

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      // Dropdown functionality
      const dropdown = document.getElementById('projectsDropdown');
      const toggle = document.getElementById('projectsToggle');
      const closeBtn = document.getElementById('closeDropdown');
      const searchInput = document.getElementById('searchInputDropdown');
      toggle.addEventListener('click', (e) => {
        e.preventDefault();
        dropdown.classList.add('show');
        setTimeout(() => searchInput.focus(), 100);
        updateProjects();
      });

      closeBtn.addEventListener('click', () => {
        dropdown.classList.remove('show');
      });

      // Close on outside click
      dropdown.addEventListener('click', (e) => {
        if (e.target === dropdown) {
          dropdown.classList.remove('show');
        }
      });

      // Search functionality
      searchInput.addEventListener('input', () => {
        updateProjects();
      });
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
      }
    });

    // Theme Toggle Functionality
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('.theme-icon');
    const html = document.documentElement;

    // Check for saved theme preference or default to light mode
    const currentTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
  </script>
